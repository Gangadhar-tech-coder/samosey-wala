{% load static %}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-sw fixed-top">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="{% url 'core:home' %}">
            <img src="{% static 'images/logo_nav.png' %}" alt="Samosey Wala" style="height:44px;width:auto;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,0.15);" class="me-2">
            <span class="brand-text" style="font-family:'Poppins',sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-0.5px;color:#18120F;">samosey<span style="color:#FF5500;">wala</span></span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Offcanvas Menu -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="navbarOffcanvasLabel" style="font-family:'Playfair Display',serif;color:#FF5500;">SAMOSEY WALA</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <!-- Center Links -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-link-sw {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'core:home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-sw {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'core:about' %}">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-sw {% if request.resolver_match.url_name == 'menu' %}active{% endif %}" href="{% url 'products:menu' %}">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-sw {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'enquiries:contact' %}">Contact Us</a>
                    </li>
                </ul>

                <!-- Order Now Button -->
                <div class="d-flex align-items-center">
                    <a href="{% url 'orders:order_page' %}" class="btn btn-order-now d-flex align-items-center" style="background-color:#FF5500;color:#fff;border-radius:30px;padding:10px 24px;font-weight:600;font-family:'Poppins',sans-serif;">
                        <span>Order Now</span>
                        <span class="cart-badge badge rounded-pill ms-2" style="background-color:#FFB347;color:#211C18;font-size:0.75rem;padding:4px 8px;display:none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
