services:
  - type: web
    name: samosey-wala
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: samosey-wala-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.10

databases:
  - name: samosey-wala-db
    databaseName: samosey_db
    user: samosey_user
    plan: free
